<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="avatarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a75d3"/>
      <stop offset="100%" stop-color="#124ca5"/>
    </linearGradient>
    <filter id="avatarGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Rounded Square -->
  <rect width="100" height="100" rx="16" fill="url(#avatarGrad)"/>
  <!-- Eyes -->
  <g filter="url(#avatarGlow)">
    <rect x="26" y="30" width="11" height="18" rx="5.5" fill="#ffffff"/>
    <rect x="63" y="30" width="11" height="18" rx="5.5" fill="#ffffff"/>
    <!-- Iconic Smile -->
    <path d="M26 60 C36 78, 64 78, 74 60" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
